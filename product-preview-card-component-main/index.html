<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
   <link rel="stylesheet" href="css/normalize.css">
   <link rel="stylesheet" href="css/style.css">
  <style>
    
  </style>
</head>
<body>

  <div class="container" itemtype="https://schema.org/Product">
    <header>
      <div class="container-img">
        <picture>
          <source srcset="assets/images/image-product-desktop.jpg" media="(min-width: 1440px)">
          <img src="assets/images/image-product-mobile.jpg" alt="Gabrielle chanel perfume">
        </picture>
      </div>
    
      <h1>Perfume</h1>
    </header>
    <main>
      <h2 itemprop="name">Gabrielle Essence Eau De Parfum</h2>
      <p itemprop="description">
        A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.
      </p>
      <div class="price-container">
        <span itemprop="offers" itemtype="https://schema.org/Offer"><span itemprop="priceCurrency" content="USD">$</span><span itemprop="price" content="149.99">149.99</span></span>
        <del>$169.99</del>
      </div>
      <button><img src="assets/images/icon-cart.svg" alt="icon cart">Add to Cart</button>
      
    </main>
  </div>
  
  <footer>
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/javmova">Javier Molina</a>.
  </footer>
</body>
</html>
